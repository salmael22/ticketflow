server:
  port: 8080

spring:
  application:
    name: gateway-api
  config:
    import: "configserver:http://localhost:8888"
  cloud:
    config:
      label: main
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - AddResponseHeader=X-Served-By, gateway-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway