ticketflow:
  clients:
    event-service:
      url: ${EVENT_SERVICE_URL:}
  resilience:
    event-service:
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-in-open-state: 10s
      permitted-calls-in-half-open-state: 3
      time-limit: 4s

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
        group:
          enabled: true